name: Windows build and regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build MSFSModManager.sln -c Release
      - name: Regression checks
        shell: pwsh
        run: |
          $output = dotnet run --project tests/ModInstaller.Regression -c Release 2>&1 | Out-String
          $result = $LASTEXITCODE
          Write-Output $output
          if ($result -ne 0) {
            $message = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $result
          }
      - name: Publish
        run: dotnet publish src/ModInstaller.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/MSFSModManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path publish/MSFSModManager.exe.sha256 -Value "$hash  MSFSModManager.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MSFSModManager-win-x64
          path: |
            publish/MSFSModManager.exe
            publish/MSFSModManager.exe.sha256
