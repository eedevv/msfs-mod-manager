name: Windows build and regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build MSFSModManager.sln -c Release
      - name: Regression checks
        run: dotnet run --project tests/ModInstaller.Regression -c Release
      - name: Publish
        run: dotnet publish src/ModInstaller.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MSFSModManager-win-x64
          path: publish/MSFSModManager.exe
